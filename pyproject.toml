[project]
name = "vsearch"
version = "0.1.0"
description = "Multimodal visual search engine: text-to-image and image-to-image retrieval over large image corpora."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "Mehdi Ebrahimzadeh Veshareh" }]
keywords = ["computer-vision", "clip", "dinov3", "retrieval", "faiss", "onnx"]

dependencies = [
    # Core numerics / vision
    "torch>=2.4",
    "torchvision>=0.19",
    "transformers>=4.53",
    "pillow>=10.4",
    "numpy>=1.26",
    # Vector index
    "faiss-cpu>=1.9",
    # Data
    "datasets>=3.0",
    "pyarrow>=17.0",
    "pandas>=2.2",
    # hf_xet enables Xet-backed chunked downloads. Both corpora and every
    # checkpoint are Xet-hosted; without it the hub silently falls back to
    # plain HTTP, which matters when pulling ~2 GB of images.
    "huggingface-hub[hf_xet]>=0.34",
    # Service
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "gradio>=5.0",
    # Config / CLI
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
onnx = [
    "onnx>=1.16",
    "onnxruntime>=1.19",
    # torch>=2.9 routes torch.onnx.export through the dynamo exporter, which
    # requires onnxscript. Without it the export fails at import time.
    "onnxscript>=0.5",
    # Peak RSS for the benchmark table. A latency number without a memory
    # number hides the actual reason to quantize on a 2-vCPU Space.
    "psutil>=6.0",
]
qdrant = ["qdrant-client>=1.11"]

[project.scripts]
vsearch = "vsearch.cli:app"

[project.urls]
Repository = "https://github.com/"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "httpx>=0.27",
    "pandas-stubs>=2.2",
    "types-requests>=2.32",
    "types-psutil>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vsearch"]

# ---------------------------------------------------------------------------
# Torch on Linux (CI, Docker, HF Spaces) must come from the CPU index.
# The default PyPI Linux wheel bundles CUDA and is ~2.5 GB -- unusable on a
# CPU-only Space and ruinous for CI cache. Windows PyPI wheels are already
# CPU-only, so they are left alone. Colab supplies its own CUDA torch.
# ---------------------------------------------------------------------------
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # flake8-bugbear
    "C4",       # comprehensions
    "SIM",      # simplify
    "PTH",      # use pathlib
    "RUF",      # ruff-specific
]
ignore = [
    "B008",  # function call in default arg -- required by FastAPI/Typer idiom
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
# Gradio expresses layout as nested `with` blocks whose indentation mirrors the
# rendered UI hierarchy. Collapsing them (SIM117) is functionally equivalent but
# flattens the structure that makes the file readable.
"src/vsearch/ui/app.py" = ["SIM117"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

# Third-party packages without bundled type stubs.
[[tool.mypy.overrides]]
module = ["faiss.*", "transformers.*", "datasets.*", "gradio.*", "optimum.*", "onnxruntime.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: requires network or model download (deselect with '-m \"not slow\"')",
]
